# Compila el APK en la nube en cada push a main y lo publica como Release.
# Enlace fijo para descargarlo desde la TV:
#   https://github.com/<usuario>/<repo>/releases/latest/download/app-debug.apk
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Si falla, muestra los errores como anotaciones visibles en la página del build.
      - name: Reportar errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Unresolved|> " build.log | grep -v "^> Task" | head -80 > errs.txt || true
          [ -s errs.txt ] || tail -80 build.log > errs.txt
          split -l 15 errs.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
          done

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AnimeTV build ${{ github.run_number }}
          body: APK compilado automáticamente desde ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
